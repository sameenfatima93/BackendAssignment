<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Websites</title>
    <style>
        body {
            background-image: url(bg.jpg);
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            color: rgb(255, 255, 255);
            padding: 30px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.568);
            z-index: -1;
        }

        a {
            display: inline-block;
            /* background-color: #8e44ad; */
            color: white;
            /* padding: 10px 20px; */
            margin: 5px;
            /* border-radius: 8px; */
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: cadetblue;

            transform: scale(1.05);
        }

        .box {
            display: flex;
            justify-content: space-evenly;
            gap: 10px;
        }

        .box a {
            width: 200px;
        }

        .box img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid white;
        }
    </style>
</head>

<body>


    <h1>My Favorite Web Page</h1>

    <p>
        I frequently use different websites for learning, communication,
        entertainment, and improving my web development skills.
    </p>

    <h2>My Favorite Websites</h2>

    <ul>
        <li>
            <a href="https://www.youtube.com/" target="_blank">
                YouTube
            </a>
        </li>

        <li>
            <a href="https://www.github.com/" target="_blank">
                GitHub
            </a>
        </li>

        <li>
            <a href="https://www.w3schools.com/" target="_blank">
                W3Schools
            </a>
        </li>
    </ul>

    <h2>My Favorite Website Image</h2>

    <div class="box">

        <a href="https://www.youtube.com/@sheryians" target="_blank">
            <img src="sheriyans.jpg" alt="YouTube website logo" width="250">
        </a>
        <a href="https://www.youtube.com/@SaylaniMassITTraining" target="_blank">
            <img src="SMIT.jpg" alt="YouTube website logo" width="250">
        </a>
        <a href="https://www.youtube.com/@chaiaurcode" target="_blank">
            <img src="chai our code.jpg" alt="YouTube website logo" width="250">
        </a>
    </div>


</body>

</html>
